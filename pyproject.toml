[project]
name = "connect-timeout-guard"
version = "0.1.2"
description = "Wrap a socket connection attempt with a monotonic-clock deadline that aborts if the TCP handshake does not complete."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
